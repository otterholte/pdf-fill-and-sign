# GitHub Pages' own builder started failing on this repository with no
# diagnostic at all — three pushes in a row reported "Page build failed" after
# zero seconds while the site carried on serving a commit from hours before.
# Deploying through Actions instead publishes the same files and, when it does
# go wrong, says so in a log you can read.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
